# /etc/mosquitto/conf.d/powermanagement.conf – Übergangsfassung
#
# Nicht die gültige Vorlage – die ist deploy/mosquitto/broker.conf.
#
# Diese Datei bleibt nur für update-debian.sh aus Fassungen ohne eigene
# MQTT-Zugänge je Shelly: Ein solches Skript holt den neuen Code, kennt
# aber den Helfer deploy/mqtt-zugaenge.sh nicht und legt keine wirksame ACL
# an. Es spielt diese Fassung ein (Mosquitto liest weiter die Grundlage
# powermanagement.acl), der Broker läuft weiter. Beim nächsten Aufruf von
# update-debian.sh – dann schon des neuen – kommen Helfer, wirksame ACL und
# broker.conf. Nicht löschen und nicht anpassen.
#
# MQTT-Broker für PowerManagement. Debians /etc/mosquitto/mosquitto.conf
# bindet dieses Verzeichnis ein und setzt bereits persistence und
# persistence_location – hier steht nur, was PowerManagement braucht.
#
# Wer spricht mit dem Broker:
#   shelly           alle Shelly-Geräte (ein gemeinsamer Zugang)
#   nodered          Node-RED: liest alles, schreibt Status und RPC-Anfragen
#   powermanagement  Oberfläche und Sammler: pm/messwert/…, Schaltbefehle
# Was jeder davon darf, steht in /etc/mosquitto/powermanagement.acl.

# Einstellungen gelten für alle Listener gemeinsam – so genügt eine
# Kennwort- und eine ACL-Datei.
per_listener_settings false

# Auf allen Schnittstellen: Die Shellys sitzen im LAN oder hinter
# WireGuard und müssen den Broker erreichen. Wer das eingrenzen will, tut
# es in der Firewall (siehe docs/installation-debian-lxc.md) – nicht hier,
# sonst fällt beim nächsten Netzwechsel die ganze Messung aus.
listener 1883

# Ohne Anmeldung geht nichts. Ein offener Broker im LAN hieße: jeder im
# Netz kann Relais schalten und Messwerte fälschen.
allow_anonymous false
password_file /etc/mosquitto/powermanagement.passwd
acl_file /etc/mosquitto/powermanagement.acl

# Retained-Nachrichten (pm/status/nodered, online-Zustände der Shellys) und
# QoS-1-Sitzungen überstehen so einen Neustart des Brokers. Doppelt zu
# Debians Vorgabe ist unschädlich; ohne sie (andere Distribution) wäre es
# sonst aus.
persistence true
autosave_interval 300
