; /etc/php/8.4/fpm/pool.d/powermanagement.conf
;
; Eigener Pool für PowerManagement – eigener Socket, eigene Grenzen, eigenes
; Sitzungsverzeichnis. Er läuft als www-data, demselben Benutzer wie der
; Sammler: beide schreiben in storage/ (Datenbank, Protokolle, Grundrisse),
; und nur storage/ gehört diesem Benutzer. Der Quellcode gehört root – was
; die Anwendung ausführt, kann sie nicht selbst verändern.
;
; Platzhalter: __APP_USER__, __APP_DIR__

[powermanagement]
user = __APP_USER__
group = __APP_USER__

listen = /run/php/powermanagement.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 30s
pm.max_requests = 500

; Uploads: Grundrisse (PDF, Bilder) bis 100 MB – SiteService::MAX_UPLOAD_BYTES.
; post_max_size mit Rand für die übrigen Formularfelder, passend zu
; client_max_body_size 105m für /standorte/grundriss in der nginx-Site.
php_admin_value[upload_max_filesize] = 100M
php_admin_value[post_max_size] = 105M
; Gemessen an Plänen mit 100 MB: rund 100 MB beim Hochladen (Seiten eines
; PDF zählen), 192 MB beim Holen eines Plans von einer anderen Instanz. gd
; hält Bilder außerhalb dieser Grenze – dafür PlanTileService::MAX_PIXEL.
php_admin_value[memory_limit] = 512M
; Zählt die Rechenzeit von PHP, nicht das Warten auf pdftoppm oder git.
php_admin_value[max_execution_time] = 300
; Den Körper puffert nginx vollständig, bevor PHP ihn bekommt – das Lesen
; über den Socket dauert auch bei 105 MB unter einer Sekunde. Die
; Übertragung vom Browser zählt hier nicht mit, egal wie langsam.
php_admin_value[max_input_time] = 120

; Sitzungen im eigenen Verzeichnis, nicht im gemeinsamen /var/lib/php/sessions
php_admin_value[session.save_path] = __APP_DIR__/storage/sessions
php_admin_value[session.cookie_httponly] = 1
php_admin_value[session.use_strict_mode] = 1

; Zugriff auf das Dateisystem eingrenzen. Programme wie pdftoppm und git
; startet die Anwendung trotzdem – sie sucht sie über PATH, nicht über
; is_file(), das open_basedir hier verbieten würde.
php_admin_value[open_basedir] = __APP_DIR__:/tmp:/usr/share/php
php_admin_value[expose_php] = 0

; Fehler ins Log, nie in die Ausgabe
php_admin_flag[display_errors] = off
php_admin_value[error_log] = __APP_DIR__/storage/logs/php-fpm.log
catch_workers_output = yes
