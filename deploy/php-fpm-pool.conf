; /etc/php/8.4/fpm/pool.d/powermanagement.conf
;
; Eigener Pool für PowerManagement – eigener Socket, eigene Grenzen, eigenes
; Sitzungsverzeichnis. Er läuft als www-data, demselben Benutzer wie der
; Sammler: beide schreiben in storage/ (Datenbank, Protokolle, Grundrisse),
; und nur storage/ gehört diesem Benutzer. Der Quellcode gehört root – was
; die Anwendung ausführt, kann sie nicht selbst verändern.
;
; Platzhalter: __APP_USER__, __APP_DIR__

[powermanagement]
user = __APP_USER__
group = __APP_USER__

listen = /run/php/powermanagement.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 30s
pm.max_requests = 500

; Uploads: Grundrisse (PDF, Bilder) – passend zu client_max_body_size 64m
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 66M
; Kacheln großer Grundrisse mit GD braucht Speicher
php_admin_value[memory_limit] = 512M
php_admin_value[max_execution_time] = 300

; Sitzungen im eigenen Verzeichnis, nicht im gemeinsamen /var/lib/php/sessions
php_admin_value[session.save_path] = __APP_DIR__/storage/sessions
php_admin_value[session.cookie_httponly] = 1
php_admin_value[session.use_strict_mode] = 1

; Zugriff auf das Dateisystem eingrenzen. Programme wie pdftoppm und git
; startet die Anwendung trotzdem – sie sucht sie über PATH, nicht über
; is_file(), das open_basedir hier verbieten würde.
php_admin_value[open_basedir] = __APP_DIR__:/tmp:/usr/share/php
php_admin_value[expose_php] = 0

; Fehler ins Log, nie in die Ausgabe
php_admin_flag[display_errors] = off
php_admin_value[error_log] = __APP_DIR__/storage/logs/php-fpm.log
catch_workers_output = yes
