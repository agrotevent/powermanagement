# /etc/nginx/sites-available/powermanagement
#
# Vorlage für Debian 13 (nginx + PHP-FPM). PowerManagement ist damit im
# lokalen Netz unter der IP des Containers erreichbar, der Node-RED-Editor
# unter /node-red/. Ein Tunnel oder Reverse-Proxy (z. B. Pangolin) wird
# getrennt eingerichtet und zeigt von außen auf genau diesen Dienst.
#
# Platzhalter (setzt das Installationsskript):
#   __LISTEN__      Adresse, auf der gelauscht wird (0.0.0.0 = alle)
#   __PORT__        Port (Vorgabe 80)
#   __APP_DIR__     Installationsverzeichnis (z. B. /opt/powermanagement)
#   __FPM_SOCKET__  PHP-FPM-Socket (/run/php/powermanagement.sock)
#   __SERVER_NAME__ interner Name, z. B. strom.intern

# WebSocket des Node-RED-Editors: Upgrade nur weiterreichen, wenn der
# Browser es verlangt – sonst die Verbindung normal schließen. Eigener
# Variablenname, damit es keinen Zusammenstoß mit einer gleichnamigen map
# einer anderen Seite gibt (nginx lehnt doppelte Variablen ab).
map $http_upgrade $pm_verbindung {
    default upgrade;
    ''      close;
}

# Steht ein TLS-terminierender Proxy davor, meldet er das Schema per
# X-Forwarded-Proto. PHP soll HTTPS=on nur sehen, wenn dort wirklich
# „https" steht – ein durchgereichtes „http" hielte PHP sonst ebenfalls für
# HTTPS (jeder nicht leere Wert außer „off" zählt dort als an).
map $http_x_forwarded_proto $pm_https {
    default '';
    https   on;
}

# Anmeldungen am Node-RED-Editor bremsen: je Adresse fünf Versuche in der
# Minute (dazu ein kleiner Puffer). Hinter dem Editor steht die Ausführung
# von Code auf dem Server – ohne Bremse ließe sich sein Kennwort in Ruhe
# durchprobieren. Hinter einem Tunnel ohne real_ip teilen sich alle Aufrufer
# diese Grenze; für den Editor genügt das.
limit_req_zone $binary_remote_addr zone=pm_nodered_anmeldung:1m rate=5r/m;

# Schnittstelle für andere Instanzen (/api/v1): je Adresse zehn Anfragen in
# der Sekunde, mit Puffer für eine Liste samt Plandateien. Raten lohnt bei
# 240 Bit ohnehin nicht – die Bremse schützt vor Dauerbeschuss, und die App
# muss deshalb keine Fehlversuche protokollieren.
limit_req_zone $binary_remote_addr zone=pm_api:1m rate=10r/s;

server {
    # default_server: auch der Aufruf über die reine IP-Adresse landet hier.
    listen __LISTEN__:__PORT__ default_server;
    # Nur einschalten, wenn der Container wirklich IPv6 hat – sonst startet
    # nginx nicht ("Address family not supported by protocol"):
    # listen [::]:__PORT__ default_server;

    server_name __SERVER_NAME__;

    root __APP_DIR__/public;
    index index.php;

    # Körpergrößen: im Allgemeinen klein (Formulare, Berichte, Katalog-Import
    # bis 5 MB, Prüfnachweise bis 10 MB). Mehr nehmen nur der Grundriss-
    # Upload (105m) und die Schnittstelle (50m) an – beide mit eigenem
    # FastCGI-Block, unten.
    #
    # Eigene Blöcke statt try_files zu index.php: Mit angekündigter Länge
    # (Content-Length) prüft nginx die Grenze in jeder location, die eine
    # Anfrage durchläuft. Kommt der Körper aber in Stücken (Transfer-Encoding:
    # chunked), zählt allein die location, in der nginx ihn liest – die mit
    # fastcgi_pass. Liefe alles über index.php, bräuchte die dort die größte
    # Grenze, und die nähme jede Adresse an, auch ohne Anmeldung.
    client_max_body_size 16m;

    # Steht ein Reverse-Proxy oder Tunnel davor, hier dessen Adresse
    # eintragen – nur dann wird X-Forwarded-For als echte Client-IP
    # übernommen.
    #   set_real_ip_from 10.10.0.5;
    #   real_ip_header X-Forwarded-For;

    access_log /var/log/nginx/powermanagement.access.log;
    error_log  /var/log/nginx/powermanagement.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Schnittstelle (/api/v1): direkt an index.php, mit Bremse und eigener
    # Größengrenze – ein Vorschlag mit Plandateien als base64 darf bis
    # 48 MiB groß sein (prüft die App selbst noch einmal). Beides wirkt
    # hier, auch für Körper in Stücken (siehe oben); kein rewrite – das
    # spränge vor der Bremse weiter.
    # Antworten von nginx selbst kommen wie die der App als JSON.
    # Hinter einem Proxy muss er den Kopf Authorization durchreichen.
    location ^~ /api/ {
        limit_req zone=pm_api burst=40 nodelay;
        limit_req_status 429;
        client_max_body_size 50m;
        error_page 429 = @pm_api_429;
        error_page 413 = @pm_api_413;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS $pm_https;
        fastcgi_pass unix:__FPM_SOCKET__;
        fastcgi_read_timeout 300;
    }
    location @pm_api_429 {
        default_type "application/json; charset=utf-8";
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 429 '{"ok":false,"message":"Zu viele Anfragen – bitte kurz warten."}';
    }
    location @pm_api_413 {
        default_type "application/json; charset=utf-8";
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 413 '{"ok":false,"message":"Der Körper ist zu groß (höchstens 48 MiB)."}';
    }

    # Grundriss hochladen: bis 100 MB (SiteService::MAX_UPLOAD_BYTES) samt
    # Formularfeldern – passend zu post_max_size 105M im PHP-FPM-Pool.
    # Direkt an index.php (siehe oben): Nur diese eine Adresse nimmt so
    # viel an, auch in Stücken. Die Übertragung puffert nginx selbst;
    # client_body_timeout (60 s) gilt je Lesevorgang, nicht für die ganze
    # Datei – auch eine langsame Leitung kommt durch, solange Daten fließen.
    # Was darüber liegt, beantwortet nginx mit einer eigenen Seite statt
    # seiner englischen Vorgabe.
    location = /standorte/grundriss {
        client_max_body_size 105m;
        error_page 413 = @pm_plan_413;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS $pm_https;
        fastcgi_pass unix:__FPM_SOCKET__;
        # Der Upload kachelt höchstens rund SiteService::KACHELZEIT_IM_UPLOAD
        # (30 s) selbst, den Rest rechnet ein eigener Prozess.
        fastcgi_read_timeout 300;
    }
    location @pm_plan_413 {
        default_type "text/html; charset=utf-8";
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 413 '<!doctype html><html lang="de"><meta charset="utf-8"><title>Datei zu groß</title><p>Die Datei ist zu groß – Grundrisse lassen sich bis 100 MB hochladen.</p><p><a href="/standorte">Zurück zu den Standorten</a></p></html>';
    }

    # Alle übrigen Seiten (über try_files von oben) – mit der Grenze des
    # Servers (16m).
    location ~ ^/index\.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:__FPM_SOCKET__;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $pm_https;
        # Wie lange nginx auf PHP wartet. Eine Anfrage, die auf Git oder
        # eine andere Instanz wartet, gibt vorher auf (App\Support\Anfragezeit,
        # 285 s für alle Schritte zusammen) und meldet es; Kacheln rechnet
        # außerhalb des Uploads nur ein eigener Prozess.
        fastcgi_read_timeout 300;
    }

    # Kein anderes PHP ausführbar
    location ~ \.php$ {
        return 404;
    }

    # Statisches, inklusive der mitgelieferten Bibliotheken (pdf.js,
    # Leaflet, uPlot). ^~ beendet die Suche – die Regeln für .php und
    # Punktdateien weiter unten greifen hier nicht.
    location ^~ /assets/ {
        expires 7d;
        access_log off;
        try_files $uri =404;

        # Ältere mime.types kennen .mjs nicht; ohne JavaScript-Typ lehnt der
        # Browser das Modul ab.
        location ~ \.mjs$ {
            default_type text/javascript;
            expires 7d;
            access_log off;
        }
    }

    # Node-RED-Editor. Node-RED selbst lauscht nur auf 127.0.0.1:1880 und
    # hat httpAdminRoot /node-red – der Pfad wird unverändert durchgereicht.
    # Die Anmeldung übernimmt Node-RED (adminAuth).
    location = /node-red {
        return 301 /node-red/;
    }
    location = /node-red/auth/token {
        limit_req zone=pm_nodered_anmeldung burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:1880;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /node-red/ {
        proxy_pass http://127.0.0.1:1880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $pm_verbindung;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Der Editor hält seinen WebSocket offen; ohne längere Frist trennt
        # nginx ihn nach 60 s und der Editor meldet „Verbindung verloren".
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        # Flows importieren
        client_max_body_size 16m;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location ~ /\.  { deny all; }
}
